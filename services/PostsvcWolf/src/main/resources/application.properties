
spring.application.name=PostsvcWolf
server.port=8082

# ===== PostgreSQL =====
spring.datasource.url=jdbc:postgresql://postgres:5432/post_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===== Redis =====
spring.data.redis.host=redis
spring.data.redis.port=6379

# ===== Kafka =====
spring.kafka.bootstrap-servers=kafka:29092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.group-id=post-service-group

# ===== Eureka =====
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.instance.prefer-ip-address=true


management.endpoints.web.exposure.include=health,info
jwt.secret=${JWT_SECRET}

# ===== Spring AI Gemini =====
spring.ai.vertex.ai.gemini.api-key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY}
spring.ai.vertex.ai.gemini.project-id=default-project-id
spring.ai.vertex.ai.gemini.location=us-central1